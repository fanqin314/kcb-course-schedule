<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<script src="kcb-data.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<title>课程表 · 有机粗野</title>
<style>
    *, *::before, *::after {
        margin: 0; padding: 0; box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    :root {
        --ink: #1A1512;
        --ink-2: #3B322A;
        --paper: #EDE3D1;
        --paper-2: #F8F3E9;
        --card: #FFFDF8;

        --clay:   #B8704B;
        --moss:   #6F8B74;
        --amber:  #BB9A5A;
        --indigo: #66799E;
        --plum:   #8F7898;
        --teal:   #6E968F;
        --rose:   #BC7E8A;

        --ok:   #2E8B57;
        --soon: #B65A38;

        --spring: cubic-bezier(.34, 1.56, .64, 1);
        --bounce: cubic-bezier(.175, .885, .32, 1.275);
        --ease:   cubic-bezier(.4, 0, .2, 1);

        /* ---- 统一字体体系：标题/正文/信息三层清晰分工 ---- */
        --study-font-display: 'Arial Black', 'Cooper Black', Impact, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --study-font-sans:    'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --study-font-mono:    'Courier New', monospace;
    }

    body {
        background: var(--paper);
        font-family: var(--study-font-sans);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--ink);
        overflow: hidden;
        position: relative;
    }

    /* ================================================
       背景有机色块
       ================================================ */
    .blobs {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
    }
    .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(72px);
        opacity: .30;
    }
    .blob.b1 {
        width: 320px; height: 320px;
        background: #DCC3AE;
        top: -120px; left: -130px;
        animation: drift1 22s ease-in-out infinite;
    }
    .blob.b2 {
        width: 300px; height: 300px;
        background: #C5D9C2;
        bottom: -110px; right: -120px;
        animation: drift2 27s ease-in-out infinite;
    }
    .blob.b3 {
        width: 240px; height: 240px;
        background: #E2D4B8;
        top: 42%; left: 58%;
        animation: drift3 31s ease-in-out infinite;
    }
    @keyframes drift1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50%      { transform: translate(46px, 34px) scale(1.18); }
    }
    @keyframes drift2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50%      { transform: translate(-40px, -30px) scale(1.12); }
    }
    @keyframes drift3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50%      { transform: translate(-30px, 40px) scale(.88); }
    }

    /* ================================================
       APP 容器
       ================================================ */
    .app {
        position: relative;
        z-index: 1;
        max-width: 480px;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        background: var(--paper-2);
        border-left: 4px solid var(--ink);
        border-right: 4px solid var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    @media (min-width: 520px) {
        body { padding: 18px 0; }
        .app {
            height: min(920px, calc(100dvh - 36px));
            border: 4px solid var(--ink);
            border-radius: 40px;
            box-shadow:
                12px 12px 0 rgba(26, 21, 18, .85),
                0 34px 70px -28px rgba(26, 21, 18, .55);
        }
    }

    /* ================================================
       顶部 Hero
       ================================================ */
    .hero {
        position: relative;
        flex-shrink: 0;
        padding: .8rem 1rem .85rem;
        background: var(--ink);
        border-radius: 0 0 32px 32px;
        overflow: hidden;
        z-index: 2;
    }
    @property --glow-hue   { syntax: '<number>';     initial-value: 25; inherits: true; }
    @property --glow-sat   { syntax: '<percentage>'; initial-value: 70%; inherits: true; }
    @property --glow-light { syntax: '<percentage>'; initial-value: 55%; inherits: true; }
    @property --glow-alpha { syntax: '<number>';     initial-value: 0.6; inherits: true; }
    @property --glow-bright{ syntax: '<number>';     initial-value: 1;   inherits: true; }

    .hero::before {
        content: '';
        position: absolute;
        width: 300px; height: 300px;
        top: -160px; right: -110px;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(
            circle,
            hsl(var(--glow-hue) var(--glow-sat) var(--glow-light) / var(--glow-alpha)),
            transparent 68%
        );
        filter: brightness(var(--glow-bright));
        will-change: filter, transform, background;
        transition:
            --glow-hue .8s, --glow-sat .8s,
            --glow-light .8s, --glow-alpha .8s, --glow-bright .8s;
        animation: glowFloat 15s ease-in-out infinite;
    }
    .hero::after {
        content: '';
        position: absolute;
        width: 240px; height: 240px;
        bottom: -170px; left: -90px;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(
            circle,
            hsl(var(--glow-hue) var(--glow-sat) var(--glow-light) / calc(var(--glow-alpha) * 0.7)),
            transparent 68%
        );
        filter: brightness(var(--glow-bright));
        will-change: filter, transform, background;
        transition:
            --glow-hue .8s, --glow-sat .8s,
            --glow-light .8s, --glow-alpha .8s, --glow-bright .8s;
        animation: glowFloat 19s ease-in-out infinite reverse;
    }
    .hero.glow-no-transition::before,
    .hero.glow-no-transition::after { transition: none; }
    @keyframes glowFloat {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50%      { transform: translate(-26px, 20px) scale(1.14); }
    }

    /* ---- 花朵绽开：Hero 内部交错入场（首次加载触发一次） ---- */
    @keyframes heroIn {
        from { opacity: 0; transform: translateY(-14px) scale(.92); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .hero > * {
        animation: heroIn .62s var(--spring) backwards;
    }
    .hero > *:nth-child(1) { animation-delay: .05s; }
    .hero > *:nth-child(2) { animation-delay: .15s; }
    .hero > *:nth-child(3) { animation-delay: .25s; }
    .hero > *:nth-child(4) { animation-delay: .35s; }

    .hero-top {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: .8rem;
    }

    .hero-right {
        display: flex;
        align-items: center;
        gap: .6rem;
    }
    .view-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        padding: 0;
        border: 2.5px solid #fff;
        background: var(--ink);
        color: #fff;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 2px 2px 0 rgba(0, 0, 0, .35), inset 0 -2px 0 rgba(255, 255, 255, .25);
        transition: transform .2s var(--spring), box-shadow .2s var(--spring), background .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease);
    }
    .view-toggle.is-week {
        background: #fff;
        color: var(--ink);
        border-color: var(--ink);
        box-shadow: 2px 2px 0 rgba(26, 21, 18, .85), inset 0 -2px 0 rgba(26, 21, 18, .25);
    }
    .view-toggle .ic { width: .95rem; height: .95rem; flex-shrink: 0; }
    .view-toggle:hover { transform: translateY(-2px) scale(1.04); }
    .view-toggle:active {
        transform: scale(.94);
        box-shadow: 1px 1px 0 rgba(26, 21, 18, .85);
    }

    .clock {
        display: flex;
        align-items: baseline;
        font-family: var(--study-font-display);
        font-size: 2.9rem;
        line-height: .9;
        color: #fff;
        letter-spacing: -.035em;
        text-shadow: 0 2px 0 rgba(0, 0, 0, .28);
    }
    .clock .colon {
        color: var(--amber);
        margin: 0 .06em;
        animation: colonBlink 1s steps(1) infinite;
    }
    @keyframes colonBlink {
        0%, 50%   { opacity: 1; }
        51%, 100% { opacity: .28; }
    }
    .clock .seconds {
        font-family: var(--study-font-mono);
        font-size: .76rem;
        font-weight: 900;
        color: var(--ink);
        background: var(--amber);
        border: 2px solid #fff;
        border-radius: 999px;
        padding: .08rem .45rem .1rem;
        margin-left: .38rem;
        letter-spacing: 0;
        text-shadow: none;
        display: inline-block;
    }
    .clock .seconds.tick { animation: secTick .42s var(--bounce); }
    @keyframes secTick {
        0%   { transform: scale(1) rotate(0deg); }
        45%  { transform: scale(1.28) rotate(-5deg); background: #fff; }
        100% { transform: scale(1) rotate(0deg); }
    }

    /* ---- 日期 ---- */
    .date-block {
        text-align: right;
        color: #fff;
        padding-top: .18rem;
    }
    .date-block .day-name {
        font-size: 1.22rem;
        line-height: 1;
        letter-spacing: .02em;
    }
    .date-block .date-full {
        font-family: var(--study-font-mono);
        font-size: .65rem;
        color: rgba(255, 255, 255, .55);
        margin-top: .32rem;
        letter-spacing: .05em;
    }

    /* ================================================
       周次控制行
       ================================================ */
    .week-row {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: .4rem;
        margin-top: .7rem;
    }

    /* ---- 一体式周次控件 ---- */
    .week-ctrl {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: stretch;
        height: 2.15rem;
        background: rgba(255, 255, 255, .07);
        border: 2.5px solid rgba(255, 255, 255, .85);
        border-radius: 999px;
        overflow: hidden;
        transition: border-color .25s var(--ease), background .25s var(--ease);
    }
    .week-ctrl.pulse { animation: ctrlPulse .62s var(--ease); }
    @keyframes ctrlPulse {
        0%   { box-shadow: 0 0 0 0 rgba(187, 154, 90, .75); }
        100% { box-shadow: 0 0 0 13px rgba(187, 154, 90, 0); }
    }

    .week-ctrl .wc-arrow {
        position: relative;
        width: 2.1rem;
        flex-shrink: 0;
        border: none;
        background: transparent;
        color: #fff;
        font-family: var(--study-font-mono);
        font-size: .78rem;
        font-weight: 900;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
        transition: transform .18s var(--spring), background .18s var(--ease), color .18s var(--ease);
    }
    .week-ctrl .wc-arrow:hover { transform: translateY(-2px) scale(1.1); }
    .week-ctrl .wc-arrow:active { transform: scale(.94); }
    .week-ctrl .wc-arrow svg {
        width: 1.1rem;
        height: 1.1rem;
        display: block;
    }
    .week-ctrl .wc-arrow::after {
        content: '';
        position: absolute;
        top: 26%;
        bottom: 26%;
        width: 1.5px;
        background: rgba(255, 255, 255, .3);
        border-radius: 2px;
        transition: background .18s var(--ease);
    }
    #prevWeek::after { right: 0; }
    #nextWeek::after { left: 0; }

    .week-ctrl .wc-arrow:active {
        background: #fff;
        color: var(--ink);
    }
    #prevWeek:active::after,
    #nextWeek:active::after {
        background: rgba(26, 21, 18, .16);
    }

    .week-ctrl .wc-label {
        flex: 1;
        min-width: 0;
        border: none;
        background: transparent;
        color: #fff;
        font-family: var(--study-font-display);
        font-size: .78rem;
        font-weight: 900;
        letter-spacing: .03em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .18rem;
        padding: 0 .3rem;
        white-space: nowrap;
        transition: transform .15s var(--spring), background .2s var(--ease), color .2s var(--ease);
    }
    .week-ctrl .wc-label span {
        display: inline-block;
        min-width: 1.05em;
        text-align: center;
        color: var(--amber);
        transition: color .2s var(--ease);
    }
    .week-ctrl .wc-label span.bump { animation: numberBump .45s var(--bounce); }
    @keyframes numberBump {
        0%   { transform: scale(1); }
        40%  { transform: scale(1.7); color: #fff; }
        100% { transform: scale(1); }
    }
    .week-ctrl .wc-label:active {
        transform: scale(.96);
        background: #fff;
        color: var(--ink);
    }
    .week-ctrl .wc-label:active span { color: var(--clay); }

    /* ---- 今天 / 下节 ---- */
    .week-row .today-btn,
    .week-row .next-btn {
        height: 2.15rem;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2.5px solid;
        border-radius: 999px;
        font-family: var(--study-font-mono);
        font-size: .72rem;
        font-weight: 900;
        letter-spacing: .06em;
        cursor: pointer;
        transition:
            transform .22s var(--spring),
            background .18s,
            color .18s,
            border-color .18s;
    }
    .week-row .today-btn:hover,
    .week-row .next-btn:hover { transform: translateY(-2px) scale(1.03); }
    .week-row .today-btn:active,
    .week-row .next-btn:active { transform: scale(.94); }

    /* ---- 统一的聚焦 / 选中态（仅 box-shadow/outline，不影响布局） ---- */
    .week-ctrl:focus-within {
        border-color: var(--amber);
        box-shadow: 0 0 0 2px rgba(187, 154, 90, .35);
    }
    .today-btn:focus-visible,
    .next-btn:focus-visible,
    .wc-arrow:focus-visible,
    .view-toggle:focus-visible,
    .course-card:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
    }

    .today-btn {
        background: var(--clay);
        border-color: var(--clay);
        color: #fff;
        padding: 0 .68rem;
    }
    .today-btn:active {
        background: #fff;
        color: var(--clay);
        border-color: #fff;
    }

    .next-btn {
        background: var(--amber);
        border-color: var(--amber);
        color: var(--ink);
        padding: 0 .68rem;
        white-space: nowrap;
    }
    .next-btn:active {
        background: #fff;
        color: var(--ink);
        border-color: #fff;
    }

    /* ---- 「现在」面板 ---- */
    .now-panel {
        position: relative;
        z-index: 1;
        margin-top: .7rem;
        padding: .7rem .95rem .7rem;
        background: rgba(255, 255, 255, .09);
        border: 2.5px solid rgba(255, 255, 255, .2);
        border-radius: 26px;
        overflow: hidden;
        transition: background .5s var(--ease), border-color .5s var(--ease);
    }
    .now-panel::before {
        content: '';
        position: absolute;
        width: 150px; height: 150px;
        right: -58px; top: -66px;
        background: rgba(255, 255, 255, .13);
        pointer-events: none;
        animation: morphBlob 13s ease-in-out infinite;
    }
    @keyframes morphBlob {
        0%, 100% {
            border-radius: 50% 45% 55% 40% / 50% 55% 45% 50%;
            transform: rotate(0deg) scale(1);
        }
        33% {
            border-radius: 40% 56% 44% 60% / 56% 40% 60% 44%;
            transform: rotate(22deg) scale(1.12);
        }
        66% {
            border-radius: 56% 40% 60% 44% / 40% 60% 44% 56%;
            transform: rotate(-16deg) scale(.94);
        }
    }
    .now-panel.is-active {
        background: linear-gradient(135deg, #38c46f 0%, #24a851 55%, #189c46 100%);
        border-color: rgba(255, 255, 255, .5);
        --progress: 0%;
    }
    .now-panel.is-active::before {
        content: '';
        position: absolute;
        top: -26px; bottom: -26px; left: -40px;
        width: calc(var(--progress) + 40px);
        background: #fff;
        filter: url(#waterWave);
        z-index: 0;
        pointer-events: none;
        transition: width .9s var(--bounce);
        animation: wavePush 5s ease-in-out infinite;
        border-radius: 22px 22px 22px 10px;
    }
    @keyframes wavePush {
        0%, 100% { transform: translateX(0); }
        50%      { transform: translateX(-4px); }
    }
    .now-panel.is-active.is-complete::before {
        filter: none;
        animation: none;
        width: calc(100% + 80px);
        border-radius: 0;
        transition-duration: .15s;
    }
    .now-panel.is-active .now-status,
    .now-panel.is-active .now-title,
    .now-panel.is-active .now-meta { z-index: 1; }
    .now-panel.is-active .now-status { color: rgba(10, 61, 30, .9); }
    .now-panel.is-active .now-status .dot { background: #0a3d1e; }
    .now-panel.is-active .now-title { color: #0a3d1e; }
    .now-panel.is-active .now-meta { color: #0a3d1e; }
    .now-panel.is-active .now-meta .room {
        background: rgba(10, 61, 30, .14);
        border-color: rgba(10, 61, 30, .42);
        color: #0a3d1e;
    }
    .now-panel.is-active .now-meta .countdown {
        background: rgba(10, 61, 30, .14);
        color: #0a3d1e;
    }
    .now-panel.is-upcoming { background: var(--soon); border-color: rgba(255, 255, 255, .42); }
    .now-panel.is-empty    { background: rgba(255, 255, 255, .06); }

    .now-status {
        position: relative;
        display: flex;
        align-items: center;
        gap: .45rem;
        font-family: var(--study-font-mono);
        font-size: .66rem;
        font-weight: 900;
        letter-spacing: .16em;
        color: rgba(255, 255, 255, .92);
        margin-bottom: .4rem;
    }
    .now-status .dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #fff;
        flex-shrink: 0;
    }
    #nowStatusText {
        display: inline-flex;
        align-items: center;
        gap: .3rem;
    }
    #nowStatusText svg {
        width: .82rem;
        height: .82rem;
        flex-shrink: 0;
    }
    .now-panel.is-active .now-status .dot {
        animation: pulseDot 1.5s ease-in-out infinite;
    }
    @keyframes pulseDot {
        0%, 100% {
            transform: scale(1);
            opacity: 1;
            box-shadow: 0 0 0 0 rgba(255, 255, 255, .7);
        }
        50% {
            transform: scale(1.15);
            opacity: .9;
            box-shadow: 0 0 0 8px rgba(255, 255, 255, 0);
        }
    }

    .now-title {
        position: relative;
        font-size: 1.32rem;
        font-weight: 900;
        line-height: 1.18;
        letter-spacing: -.01em;
        color: #fff;
        word-break: break-word;
        margin-bottom: .35rem;
    }
    .now-panel.is-empty .now-title {
        font-size: 1.02rem;
        color: rgba(255, 255, 255, .72);
    }

    .now-meta {
        position: relative;
        display: flex;
        align-items: baseline;
        gap: .5rem;
        flex-wrap: wrap;
        font-family: var(--study-font-mono);
        color: #fff;
        font-weight: 700;
        margin-bottom: .6rem;
    }
    .now-meta.hidden { display: none; }
    .now-meta .time {
        font-size: 1.28rem;
        font-weight: 900;
        letter-spacing: .01em;
    }
    .now-meta .room {
        font-size: .76rem;
        background: rgba(0, 0, 0, .28);
        border: 2px solid rgba(255, 255, 255, .75);
        border-radius: 999px;
        padding: .1rem .55rem .12rem;
    }
    .now-meta .countdown {
        margin-left: auto;
        font-size: .78rem;
        font-weight: 900;
        letter-spacing: .04em;
        background: rgba(0, 0, 0, .26);
        border-radius: 999px;
        padding: .12rem .6rem .14rem;
    }
    .now-meta .countdown.urgent { animation: blinkSoft .72s ease-in-out infinite; }
    @keyframes blinkSoft {
        0%, 100% { opacity: 1; }
        50%      { opacity: .35; }
    }

    .now-progress {
        position: relative;
        height: 6px;
        display: flex;
        align-items: stretch;
        gap: 3px;
        background: rgba(0, 0, 0, .26);
        border-radius: 999px;
        overflow: hidden;
    }
    .now-progress.hidden { display: none; }
    .seg {
        position: relative;
        flex: 1;
        height: 100%;
        background: rgba(255, 255, 255, .22);
        border-radius: 999px;
        overflow: hidden;
    }
    .seg-f {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 0%;
        background: #fff;
        border-radius: 999px;
        overflow: hidden;
        transition: width .6s var(--bounce);
    }
    .seg-f::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
            115deg,
            rgba(0, 0, 0, .12) 0 7px,
            transparent 7px 14px
        );
        animation: stripes .9s linear infinite;
    }
    .now-progress-fill {
        position: relative;
        height: 100%;
        width: 0%;
        background: #fff;
        border-radius: 999px;
        transition: width .95s var(--bounce);
        overflow: hidden;
    }
    .now-progress-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
            115deg,
            rgba(0, 0, 0, .12) 0 7px,
            transparent 7px 14px
        );
        animation: stripes .9s linear infinite;
    }
    @keyframes stripes {
        from { transform: translateX(0); }
        to   { transform: translateX(14px); }
    }

    /* ================================================
       日期胶囊条（无箭头版）
       ================================================ */
    .day-strip {
        position: relative;
        z-index: 1;
        flex-shrink: 0;
        display: grid;
        grid-template-rows: 0fr;
        align-items: center;
        padding: 0 .7rem 0;
        margin-top: -0.7rem;
        margin-bottom: 0;
        transition: grid-template-rows .55s var(--spring), transform .55s var(--spring), opacity .45s var(--ease);
    }
    .day-strip > * { min-height: 0; }
    .day-strip:not(.reveal) { opacity: 0; transform: translateY(-16px); pointer-events: none; }
    .day-strip.reveal {
        grid-template-rows: 1fr;
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
    }
    .day-strip.hidden { display: none; }

    .pills-wrap {
        flex: 1;
        min-width: 0;
        display: flex;
        padding: 2px;
        background: var(--card, #FFFDF8);
        border: 2.5px solid var(--ink);
        border-radius: 0 0 18px 18px;
        box-shadow: 3px 3px 0 rgba(26, 21, 18, .85);
        overflow: hidden;
    }

    .day-pill {
        position: relative;
        flex: 1;
        min-width: 0;
        padding: .5rem 0 .6rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: transparent;
        border: none;
        border-radius: 0;
        cursor: pointer;
        user-select: none;
        overflow: hidden;
        color: var(--ink-2);
        opacity: .6;
        transition:
            background .25s var(--ease),
            color .25s var(--ease),
            opacity .25s var(--ease);
    }
    .day-pill + .day-pill {
        border-left: 1.5px solid rgba(26, 21, 18, .14);
    }
    .day-pill:active { opacity: .3; }
    .day-pill.active {
        background: var(--amber);
        color: var(--ink);
        opacity: 1;
        border-radius: 0 0 14px 14px;
        box-shadow: inset 0 2px 0 rgba(26,21,18,.22), 0 0 0 1px rgba(26,21,18,.12);
    }

    .day-pill.is-today .pill-date {
        font-size: .68rem;
        font-weight: 900;
        color: #e84b40;
        -webkit-text-stroke: 1.5px #e84b40;
        opacity: 1 !important;
    }

    .day-pill .pill-day {
        font-size: .74rem;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: .01em;
    }
    .day-pill .pill-date {
        font-family: var(--study-font-mono);
        font-size: .68rem;
        font-weight: 900;
        margin-top: .14rem;
        opacity: .68;
    }
    .day-pill.active .pill-date { opacity: .95; }

    .day-pill.is-empty .pill-day,
    .day-pill.is-empty .pill-date { opacity: .3; }
    .day-pill.is-past .pill-day,
    .day-pill.is-past .pill-date { opacity: .42; }
    .day-pill.active.is-empty .pill-day,
    .day-pill.active.is-empty .pill-date,
    .day-pill.active.is-past .pill-day,
    .day-pill.active.is-past .pill-date { opacity: 1; }

    /* 选中的胶囊从上往下滑落定位 */
    .day-pill.active {
        animation: pillDrop .4s var(--bounce);
        animation-fill-mode: none;
    }
    @keyframes pillDrop {
        from { transform: translateY(-130%); opacity: .2; }
        to   { transform: translateY(0); opacity: 1; }
    }

    /* ================================================
       主区
       ================================================ */
    .main {
        flex: 1;
        padding: .4rem .7rem 1.4rem;
        overflow-y: auto;
        overflow-x: hidden;
        position: relative;
        transition: opacity .18s var(--ease);
    }
    .main.switching { opacity: .25; }
    .main::-webkit-scrollbar { width: 6px; }
    .main::-webkit-scrollbar-track { background: transparent; }
    .main::-webkit-scrollbar-thumb {
        background: rgba(26, 21, 18, .3);
        border-radius: 999px;
    }

    /* ---- 时段分组标题 ---- */
    .time-block { margin-bottom: .55rem; }
    .time-block-header {
        display: flex;
        align-items: center;
        gap: .5rem;
        margin: .15rem 0 .6rem;
    }
    .time-block-header .icon {
        width: 1.9rem; height: 1.9rem;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        background: var(--amber);
        border: 2.5px solid var(--ink);
        border-radius: 50%;
        box-shadow: 2px 2px 0 rgba(26, 21, 18, .85);
    }
    .time-block-header .icon svg {
        width: 1.25rem;
        height: 1.25rem;
        color: var(--ink);
    }
    .time-block-header .label {
        font-size: .78rem;
        font-weight: 900;
        letter-spacing: .1em;
    }
    .time-block-header .count {
        margin-left: auto;
        font-family: var(--study-font-mono);
        font-size: .6rem;
        font-weight: 900;
        color: #fff;
        background: var(--ink);
        border-radius: 999px;
        padding: .16rem .6rem .18rem;
    }

    /* ---- 课程卡片 ---- */
    .course-card {
        position: relative;
        background: var(--card);
        border: 3px solid var(--ink);
        border-radius: 22px 22px 22px 8px;
        margin-bottom: .48rem;
        overflow: hidden;
        cursor: pointer;
        --accent: var(--indigo);
        box-shadow: 4px 4px 0 rgba(26, 21, 18, .85);
        transition:
            transform .22s var(--spring),
            box-shadow .22s var(--spring),
            opacity .35s var(--ease);
        transform: translateZ(0);
    }
    .course-card:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 rgba(26, 21, 18, .85);
    }
    .course-card:hover {
        transform: translateY(-3px);
        box-shadow: 5px 7px 0 rgba(26, 21, 18, .85);
    }
    /* 删除按钮按压只缩放按钮，卡片保持静止不抖动 */
    .course-card:has(.card-del:active) {
        transform: none;
        box-shadow: 4px 4px 0 rgba(26, 21, 18, .85);
    }
    .course-card.anim {
        animation-name: cardIn;
        animation-duration: .52s;
        animation-timing-function: var(--bounce);
        animation-fill-mode: backwards;
    }
    @keyframes cardIn {
        from { opacity: 0; transform: translateY(18px) scale(.955); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .course-card.is-active   { --accent: var(--ok); }
    .course-card.is-upcoming { --accent: var(--soon); }
    .course-card.is-ended    { --accent: #9C968C; }

    .course-card.is-ended {
        opacity: .58;
        filter: grayscale(1);
        box-shadow: 2px 2px 0 rgba(26, 21, 18, .45);
    }
    .course-card.is-ended .course-name {
        text-decoration: line-through;
        text-decoration-thickness: 2px;
        text-decoration-color: rgba(26, 21, 18, .5);
    }

    .course-card.flash { animation: flashGlow 1.9s var(--ease); }
    @keyframes flashGlow {
        0%   { box-shadow: 4px 4px 0 rgba(26, 21, 18, .85), 0 0 0 0 rgba(187, 154, 90, 0); }
        18%  { box-shadow: 4px 4px 0 rgba(26, 21, 18, .85), 0 0 0 10px rgba(187, 154, 90, .9); }
        55%  { box-shadow: 4px 4px 0 rgba(26, 21, 18, .85), 0 0 0 7px rgba(187, 154, 90, .45); }
        100% { box-shadow: 4px 4px 0 rgba(26, 21, 18, .85), 0 0 0 0 rgba(187, 154, 90, 0); }
    }

    /* ---- 时间行 ---- */
    .course-time-row {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: .5rem;
        padding: .5rem .8rem .46rem;
        padding-right: 46px;
        background: var(--accent);
        color: #fff;
        font-family: var(--study-font-mono);
        font-weight: 900;
        border-bottom: 3px solid var(--ink);
        transition: background .4s var(--ease), padding .3s var(--ease);
    }
    .course-card.has-badge .course-time-row {
        padding-right: 78px;
    }
    .course-time-row .period-label {
        font-size: .66rem;
        letter-spacing: .04em;
        background: rgba(0, 0, 0, .24);
        border: 1.5px solid rgba(255, 255, 255, .55);
        border-radius: 999px;
        padding: .12rem .55rem .14rem;
        flex-shrink: 0;
    }
    .course-time-row .time-range {
        flex: 1;
        min-width: 0;
        font-size: 1.02rem;
        letter-spacing: .01em;
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .course-content { padding: .72rem .85rem .78rem; }

    .course-name {
        font-size: 1.15rem;
        font-weight: 900;
        line-height: 1.22;
        letter-spacing: -.01em;
        word-break: break-word;
        margin-bottom: .48rem;
    }

    .course-meta {
        display: flex;
        flex-wrap: wrap;
        gap: .35rem;
    }
    .course-meta .teacher,
    .course-meta .room {
        font-family: var(--study-font-mono);
        font-size: .66rem;
        font-weight: 900;
        padding: .16rem .58rem .18rem;
        border-radius: 999px;
        border: 2px solid;
    }
    .course-meta .teacher { color: #A33A1E; background: #FBEDE7; border-color: #A33A1E; }
    .course-meta .room    { color: #24506E; background: #E9F2F8; border-color: #24506E; }

    /* ---- 状态徽章 ---- */
    .status-badge {
        position: absolute;
        top: 0; right: 0;
        z-index: 3;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--study-font-mono);
        font-size: .56rem;
        font-weight: 900;
        letter-spacing: .1em;
        padding: 0 .62rem;
        height: 1.72rem;
        border-left: 3px solid var(--ink);
        border-bottom: 3px solid var(--ink);
        border-radius: 0 19px 0 14px;
        background: var(--ink);
        color: #fff;
        white-space: nowrap;
        animation: badgeIn .4s var(--bounce) backwards;
    }
    @keyframes badgeIn {
        from { opacity: 0; transform: translate(8px, -8px) scale(.8); }
        to   { opacity: 1; transform: none; }
    }
    .course-card.is-active .status-badge   { background: #fff; color: var(--ok); }
    .course-card.is-upcoming .status-badge { background: #fff; color: var(--soon); }

    /* ---- 展开详情 ---- */
    .course-detail {
        display: grid;
        grid-template-rows: 0fr;
        background: rgba(26, 21, 18, .045);
        font-family: var(--study-font-mono);
        font-size: .69rem;
        transition: grid-template-rows .4s var(--bounce);
    }
    .course-card.expanded .course-detail { grid-template-rows: 1fr; }
    .course-detail > .detail-inner {
        overflow: hidden;
        padding: 0 .85rem;
        transition: padding .4s var(--bounce);
    }
    .course-card.expanded .detail-inner { padding: .62rem .85rem .72rem; }

    .detail-row {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: .17rem 0;
    }
    .detail-label { color: rgba(26, 21, 18, .45); }
    .detail-value { font-weight: 900; text-align: right; }

    /* ================================================
       周视图
       ================================================ */
    .week-view {
        background: var(--card);
        border: 3px solid var(--ink);
        border-radius: 22px;
        padding: .45rem;
        box-shadow: 4px 4px 0 rgba(26, 21, 18, .85);
        overflow: hidden;
        animation-name: cardIn;
        animation-duration: .45s;
        animation-timing-function: var(--bounce);
    }

    .wv-header {
        display: grid;
        grid-template-columns: 30px repeat(7, 1fr);
        gap: 4px;
        margin-bottom: 4px;
    }

    .wv-head {
        padding: .28rem 0 .24rem;
        text-align: center;
        background: #fff;
        border: 2.5px solid var(--ink);
        border-radius: 12px;
        cursor: pointer;
        transition:
            transform .18s var(--spring),
            background .3s,
            color .3s;
    }
    .wv-head:active { transform: scale(.89); }
    .wv-head.is-today { background: var(--clay); color: #fff; }
    .wv-head.is-past {
        background: #EFEAE0;
        color: rgba(26, 21, 18, .45);
        border-color: rgba(26, 21, 18, .5);
    }
    .wv-head.is-empty { background: #F7F4EE; }
    .wv-head.is-empty .wv-head-day,
    .wv-head.is-empty .wv-head-date { opacity: .4; }
    .wv-head.is-today.is-empty .wv-head-day,
    .wv-head.is-today.is-empty .wv-head-date { opacity: 1; }
    .wv-head.is-past .wv-head-day,
    .wv-head.is-past .wv-head-date { opacity: .5; }

    .wv-head-day {
        font-size: .68rem;
        font-weight: 900;
        line-height: 1.1;
    }
    .wv-head-date {
        font-family: var(--study-font-mono);
        font-size: .53rem;
        opacity: .72;
        margin-top: .08rem;
    }
    .wv-head.is-today .wv-head-date {
        display: inline-block;
        margin-top: .06rem;
        padding: .06rem .3rem .08rem;
        background: #e84b40;
        color: #fff;
        border-radius: 999px;
        font-weight: 900;
        opacity: 1 !important;
    }

    .wv-body {
        display: grid;
        grid-template-columns: 30px repeat(7, 1fr);
        gap: 4px;
        height: clamp(420px, calc(100dvh - 300px), 720px);
        position: relative;
    }

    .wv-gutter,
    .wv-col {
        position: relative;
        min-width: 0;
    }

    .wv-period {
        position: absolute;
        left: 0;
        right: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: .18rem;
        gap: .06rem;
        overflow: hidden;
        font-family: var(--study-font-mono);
        color: rgba(26, 21, 18, .5);
        background: #F3EFE6;
        border-radius: 8px;
    }
    .wv-period-num {
        font-size: .58rem;
        font-weight: 900;
        line-height: 1;
    }

    .wv-course {
        --accent: var(--indigo);
        position: absolute;
        left: 2px;
        right: 2px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding: .22rem .3rem;
        background: var(--accent);
        color: #fff;
        border: 2.5px solid var(--ink);
        border-radius: 12px 12px 12px 4px;
        font-size: .55rem;
        font-weight: 900;
        line-height: 1.16;
        word-break: break-word;
        overflow: hidden;
        cursor: pointer;
        transition:
            transform .16s var(--spring),
            box-shadow .16s var(--ease),
            background .4s var(--ease);
    }
    .wv-course:active {
        transform: scale(.93);
        z-index: 5;
        box-shadow: 0 5px 14px rgba(0, 0, 0, .32);
    }
    .wv-course.is-active {
        background: var(--ok);
        animation: wvPulse 1.8s ease-in-out infinite;
    }
    @keyframes wvPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(30, 158, 87, .6); }
        50%      { box-shadow: 0 0 0 5px rgba(30, 158, 87, .1); }
    }
    .wv-course.is-upcoming { background: var(--soon); }
    .wv-course.is-ended {
        background: #D9D3C7;
        color: rgba(26, 21, 18, .38);
        border-color: #B5AE9F;
        opacity: .8;
    }

    .wv-course-name {
        display: -webkit-box;
        -webkit-line-clamp: 5;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    /* ================================================
       空状态
       ================================================ */
    .empty-state {
        padding: 2.4rem 1rem;
        text-align: center;
        background: #fff;
        border: 3px dashed rgba(26, 21, 18, .42);
        border-radius: 28px;
        animation-name: cardIn;
        animation-duration: .5s;
        animation-timing-function: var(--bounce);
    }
    .empty-state .big-icon {
        display: block;
        width: 3rem;
        height: 3rem;
        margin: 0 auto .6rem;
        color: var(--clay);
        animation: bobble 3.4s ease-in-out infinite;
    }
    .empty-state .big-icon svg {
        width: 100%;
        height: 100%;
    }
    @keyframes bobble {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50%      { transform: translateY(-8px) rotate(-6deg); }
    }
    .empty-state .msg {
        font-size: 1.14rem;
        font-weight: 900;
        letter-spacing: .05em;
    }
    .empty-state .sub-msg {
        font-family: var(--study-font-mono);
        font-size: .69rem;
        color: rgba(26, 21, 18, .5);
        margin-top: .38rem;
    }

    /* ================================================
       底部
       ================================================ */
    .hero-title {
        position: relative;
        z-index: 1;
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: .4rem;
        font-family: var(--study-font-display);
    }
    .hero-title .brand {
        display: flex;
        align-items: center;
        gap: .45rem;
        color: #fff;
        font-family: var(--study-font-display);
        font-size: 1.05rem;
        font-weight: 900;
        letter-spacing: .04em;
    }
    .hero-title .brand svg {
        width: 1.15rem;
        height: 1.15rem;
        color: var(--amber);
        flex-shrink: 0;
    }
    .hero-title .total {
        font-family: var(--study-font-mono);
        font-size: .72rem;
        font-weight: 900;
        color: var(--ink);
        background: var(--amber);
        border-radius: 999px;
        padding: .2rem .72rem .22rem;
        white-space: nowrap;
    }

    /* ================================================
       周次选择器
       ================================================ */
    .week-picker-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        justify-content: center;
        align-items: center;
        padding: 1.2rem;
        background: rgba(26, 21, 18, .72);
        backdrop-filter: blur(7px);
        -webkit-backdrop-filter: blur(7px);
    }
    .week-picker-overlay.active {
        display: flex;
        animation: fadeIn .25s var(--ease);
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
    }

    .week-picker {
        width: 100%;
        max-width: 340px;
        padding: 1.15rem;
        background: var(--card);
        border: 4px solid var(--ink);
        border-radius: 32px;
        box-shadow: 10px 10px 0 var(--clay);
        animation: pickerIn .42s var(--bounce);
    }
    @keyframes pickerIn {
        from { opacity: 0; transform: scale(.86) rotate(-3.5deg); }
        to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .week-picker-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: .55rem;
        margin-bottom: .75rem;
        border-bottom: 3px solid var(--ink);
        font-size: 1.05rem;
        font-weight: 900;
        letter-spacing: .04em;
    }
    .week-picker-header small {
        font-family: var(--study-font-mono);
        font-size: .66rem;
        font-weight: 400;
        color: rgba(26, 21, 18, .5);
    }

    .week-picker-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: .4rem;
    }
    .week-picker-grid button {
        height: 2.3rem;
        font-family: var(--study-font-mono);
        font-size: .85rem;
        font-weight: 900;
        color: var(--ink);
        background: #fff;
        border: 2.5px solid var(--ink);
        border-radius: 14px;
        cursor: pointer;
        transition:
            transform .18s var(--spring),
            background .2s,
            color .2s;
    }
    .week-picker-grid button:active {
        transform: scale(.87);
        background: var(--ink);
        color: #fff;
    }
    .week-picker-grid button.active {
        background: var(--clay);
        color: #fff;
    }

    /* ================================================
       响应式
       ================================================ */
    @media (max-width: 400px) {
        .clock { font-size: 2.35rem; }
        .clock .seconds { font-size: .66rem; padding: .06rem .38rem .08rem; }
        .date-block .day-name { font-size: 1.02rem; }
        .date-block .date-full { font-size: .58rem; }
        .now-title { font-size: 1.12rem; }
        .now-meta .time { font-size: 1.08rem; }
        .now-meta .countdown { font-size: .68rem; }
        .course-name { font-size: 1rem; }
        .course-time-row .time-range { font-size: .9rem; }
        .course-time-row { padding: .44rem .7rem .4rem; }
        .course-card.has-badge .course-time-row { padding-right: 70px; }
        .status-badge { font-size: .52rem; padding: 0 .5rem; height: 1.6rem; }
        .day-pill { padding: .36rem 0 .3rem; border-radius: 13px; }
        .day-pill .pill-day { font-size: .68rem; }
        .day-pill .pill-date { font-size: .49rem; }
        /* 一体式控件缩窄 */
        .week-ctrl { height: 2rem; }
        .week-ctrl .wc-arrow { width: 1.8rem; font-size: .7rem; }
        .week-ctrl .wc-label { font-size: .7rem; letter-spacing: .01em; gap: .12rem; }
        .week-row .today-btn,
        .week-row .next-btn { height: 2rem; font-size: .66rem; padding: 0 .5rem; }
    }

    @media (max-width: 420px) {
        .app {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .hero { padding: .8rem .85rem .85rem; border-radius: 0 0 24px 24px; }
        .week-ctrl .wc-label { font-size: .72rem; }
        .day-strip { padding: 0 .5rem .5rem; margin-top: -.55rem; }
        .pills-wrap { border-radius: 0 0 14px 14px; }
        .day-pill { padding: .4rem 0 .5rem; }
        .main { padding: .3rem .5rem 1.1rem; }
        .wv-body { grid-template-columns: 26px repeat(7, 1fr); }
        .wv-header { grid-template-columns: 26px repeat(7, 1fr); }
        .wv-period-num { font-size: .5rem; padding-top: .12rem; }

}));

const ACCENTS = ['#B8704B', '#6F8B74', '#66799E', '#8F7898', '#6E968F', '#BC7E8A', '#BB9A5A'];

function courseColor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return ACCENTS[h % ACCENTS.length];
}

// ================================================================
//  周次解析（带缓存）
// ================================================================
const weeksCache = new Map();

function parseWeeks(weeksStr) {
    if (weeksCache.has(weeksStr)) return weeksCache.get(weeksStr);

    const result = [];
    if (!weeksStr || weeksStr.trim() === '') {
        weeksCache.set(weeksStr, result);
        return result;
    }

    for (let part of weeksStr.split(',')) {
        part = part.trim();
        if (!part) continue;
        let isOdd = false, isEven = false, rangeStr = part;
        if (part.includes('单')) { isOdd = true; rangeStr = part.replace('单', ''); }
        else if (part.includes('双')) { isEven = true; rangeStr = part.replace('双', ''); }

        if (rangeStr.includes('-')) {
            const [s, e] = rangeStr.split('-');
            const start = parseInt(s, 10), end = parseInt(e, 10);
            if (isNaN(start) || isNaN(end) || start > end) continue;
            for (let w = start; w <= end; w++) {
                if (w < 1 || w > MAX_WEEK) continue;
                if (isOdd && w % 2 === 0) continue;
                if (isEven && w % 2 === 1) continue;
                result.push(w);
            }
        } else {
            const w = parseInt(rangeStr, 10);
            if (!isNaN(w) && w >= 1 && w <= MAX_WEEK) {
                if (isOdd && w % 2 === 0) continue;
                if (isEven && w % 2 === 1) continue;
                result.push(w);
            }
        }
    }

    const sorted = [...new Set(result)].sort((a, b) => a - b);
    weeksCache.set(weeksStr, sorted);
    return sorted;
}

function isActive(course, week) {
    return parseWeeks(course.weeks).includes(week);
}

// ================================================================
//  时间映射
// ================================================================
function getPeriodTime(day, period) {
    if ((day === 5 || day === 6) && period >= 5 && period <= 8 && SPECIAL_PM_TIMES[period]) {
        return SPECIAL_PM_TIMES[period];
    }
    return NORMAL_TIMES[period] || { start: '--:--', end: '--:--' };
}

function getTimeRange(day, startPeriod, span) {
    const endPeriod = startPeriod + span - 1;
    const s = getPeriodTime(day, startPeriod);
    const e = getPeriodTime(day, endPeriod);
    return `${s.start}–${e.end}`;
}

function timeToMinutes(str) {
    const [h, m] = str.split(':').map(Number);
    return h * 60 + m;
}

// ---- 周视图时间轴：上课段按真实时长、空闲间隙压缩 ----
const DAY_VIEW_START = timeToMinutes('8:00');
const DAY_VIEW_END = timeToMinutes('21:30');
const GAP_FACTOR = 0.16;   // 课间等短空档按真实时长的 16% 显示
const MEAL_FACTOR = 0.05;  // 午休/晚间等长空档(>40分钟)按 5% 显示，压掉 4/5 节之间的大空白

// 普通作息的全天连续教学带：只含普通上午+下午+晚上时段
function buildNormalRanges() {
    const ranges = [];
    for (let p = 1; p <= 10; p++) {
        const t = NORMAL_TIMES[p];
        if (!t || !t.start || t.start === '--:--') continue;
        ranges.push([timeToMinutes(t.start), timeToMinutes(t.end)]);
    }
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const r of ranges) {
        const last = merged[merged.length - 1];
        if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
        else merged.push([r[0], r[1]]);
    }
    return merged;
}

// 空隙长度决定压缩比例：长空档(午休/晚间)狠压，短空档(课间)轻压
function gapFactor(s, prev) { return (s - prev) > 40 ? MEAL_FACTOR : GAP_FACTOR; }

// 把真实钟点压缩成轴坐标：教学带全尺寸、空闲间隙缩小。
// 全周共用同一条普通作息轴定位，保证同一节次在任何天都排在同一高度。
const buildAxis = (() => {
    const ranges = buildNormalRanges();
    const compMin = (m) => {
        let c = 0, prev = DAY_VIEW_START;
        for (const [s, e] of ranges) {
            const f = gapFactor(s, prev);
            if (m <= s) return c + (m - prev) * f;
            if (m < e) return c + (s - prev) * f + (m - s);
            c += (s - prev) * f + (e - s);
            prev = e;
        }
        return c + (m - prev) * gapFactor(DAY_VIEW_END, prev);
    };
    const span = compMin(DAY_VIEW_END);
    return {
        top:  (min)     => (compMin(min) / span) * 100,
        size: (s, e)    => ((compMin(e) - compMin(s)) / span) * 100
    };
})();

function getNowMinutes() {
    const n = new Date();
    return n.getHours() * 60 + n.getMinutes();
}

function getTodayInfo() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const start = new Date(SEMESTER_START);
    start.setHours(0, 0, 0, 0);
    const diffDays = Math.round((today - start) / 86400000);
    if (diffDays < 0) return null;
    const week = Math.floor(diffDays / 7) + 1;
    const day = (diffDays % 7) + 1;
    if (week < 1 || week > MAX_WEEK) return null;
    return { week, day };
}

function isViewingToday() {
    const t = getTodayInfo();
    return !!(t && t.week === state.week && t.day === state.day);
}

function isPastDate(week, day) {
    const t = getTodayInfo();
    if (!t) return false;
    if (week < t.week) return true;
    if (week === t.week && day < t.day) return true;
    return false;
}

// ================================================================
//  状态持久化
// ================================================================
const STORAGE_KEY = 'schedule_state_v7';

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const p = JSON.parse(raw);
            if (typeof p.week === 'number' && typeof p.day === 'number') {
                return {
                    week: p.week,
                    day: p.day,
                    viewMode: p.viewMode === 'week' ? 'week' : 'day'
                };
            }
        }
    } catch (_) {}
    return null;
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            week: state.week,
            day: state.day,
            viewMode: state.viewMode
        }));
    } catch (_) {}
}

let state = { week: 1, day: 1, viewMode: 'day' };
const saved = loadState();
if (saved) {
    state.week = Math.min(Math.max(saved.week, 1), MAX_WEEK);
    state.day = Math.min(Math.max(saved.day, 1), 7);
    state.viewMode = saved.viewMode;
} else {
    const t = getTodayInfo();
    if (t) { state.week = t.week; state.day = t.day; }
}

const clockSEl = document.getElementById('clockS');
let lastSec = -1;

function updateClock() {
    const now = new Date();
    document.getElementById('clockH').textContent = String(now.getHours()).padStart(2, '0');
    document.getElementById('clockM').textContent = String(now.getMinutes()).padStart(2, '0');

    if (now.getSeconds() !== lastSec) {
        lastSec = now.getSeconds();
        clockSEl.textContent = String(now.getSeconds()).padStart(2, '0');
        clockSEl.classList.remove('tick');
        void clockSEl.offsetWidth;
        clockSEl.classList.add('tick');
    }
}

// ================================================================
//  「现在」面板
// ================================================================
function formatMin(min) {
    if (min < 60) return `${min}分钟`;
    const h = Math.floor(min / 60), m = min % 60;
    return m === 0 ? `${h}小时` : `${h}小时${m}分`;
}

function updateNowPanel(dayCourses, day, viewingToday) {
    const panel = document.getElementById('nowPanel');
    const metaEl = document.getElementById('nowMeta');
    const progressEl = document.getElementById('nowProgress');
    const fill = document.getElementById('progressFill');
    const statusText = document.getElementById('nowStatusText');
    const title = document.getElementById('nowTitle');
    const timeEl = document.getElementById('nowTime');
    const roomEl = document.getElementById('nowRoom');
    const cdEl = document.getElementById('nowCountdown');

    panel.className = 'now-panel';
    panel.style.setProperty('--progress', '0%');
    panel.classList.remove('is-complete');
    metaEl.classList.remove('hidden');
    progressEl.classList.add('hidden');
    if (fill) fill.style.width = '0%';

    if (!viewingToday) {
        panel.classList.add('is-empty');
        statusText.innerHTML = `${ICON_CALENDAR} 非今日`;
        title.textContent = `第 ${state.week} 周 · 周${DAY_NAMES[state.day - 1]}`;
        metaEl.classList.add('hidden');
        return;
    }

    if (dayCourses.length === 0) {
        panel.classList.add('is-empty');
        statusText.innerHTML = `${ICON_MUG} 今日无课`;
        title.textContent = '好好休息';
        metaEl.classList.add('hidden');
        return;
    }

    const nowMin = getNowMinutes();
    let active = null, upcoming = null;
    let earliest = Infinity, latest = -Infinity;

    for (const c of dayCourses) {
        const s = timeToMinutes(getPeriodTime(day, c.start).start);
        const e = timeToMinutes(getPeriodTime(day, c.start + c.span - 1).end);
        if (s < earliest) earliest = s;
        if (e > latest) latest = e;

        if (nowMin > e) continue;
        if (nowMin >= s && nowMin <= e) active = c;
        else if (nowMin < s && !upcoming) upcoming = c;
    }

    if (active) {
        const e = timeToMinutes(getPeriodTime(day, active.start + active.span - 1).end);
        const remain = Math.max(0, e - nowMin);
        panel.classList.add('is-active');
        statusText.innerHTML = `${ICON_DOT} 正在上课`;
        title.textContent = active.name;
        timeEl.textContent = getTimeRange(day, active.start, active.span);
        roomEl.textContent = active.room;
        cdEl.textContent = `剩 ${formatMin(remain)}`;
        cdEl.className = 'countdown' + (remain <= 5 ? ' urgent' : '');
    } else if (upcoming) {
        const s = timeToMinutes(getPeriodTime(day, upcoming.start).start);
        const remain = Math.max(0, s - nowMin);
        panel.classList.add('is-upcoming');
        statusText.innerHTML = `${ICON_CLOCK} 下一节`;
        title.textContent = upcoming.name;
        timeEl.textContent = getTimeRange(day, upcoming.start, upcoming.span);
        roomEl.textContent = upcoming.room;
        cdEl.textContent = `${formatMin(remain)}后开始`;
        cdEl.className = 'countdown' + (remain <= 5 ? ' urgent' : '');
    } else {
        panel.classList.add('is-empty');
        statusText.innerHTML = `${ICON_CHECK} 今日结束`;
        title.textContent = '明天见';
        metaEl.classList.add('hidden');
        return;
    }

    progressEl.classList.remove('hidden');
    // 底部条：一天多节课，每节课一段，走完全部代表这天结束
    const segs = dayCourses.map(c => {
        const s = timeToMinutes(getPeriodTime(day, c.start).start);
        const e = timeToMinutes(getPeriodTime(day, c.start + c.span - 1).end);
        if (nowMin >= e) return 100;
        if (nowMin >= s && e > s) return Math.round(((nowMin - s) / (e - s)) * 100);
        return 0;
    });
    renderSegmented(progressEl, segs);
    // 背景水波：只随当前这节课的时间推进（0→100）
    let wavePct = 0;
    if (active) {
        const sA = timeToMinutes(getPeriodTime(day, active.start).start);
        const eA = timeToMinutes(getPeriodTime(day, active.start + active.span - 1).end);
        wavePct = eA > sA ? Math.round(Math.max(0, Math.min(1, (nowMin - sA) / (eA - sA))) * 100) : 100;
    }
    panel.style.setProperty('--progress', wavePct + '%');
    panel.classList.toggle('is-complete', wavePct >= 100);
}

// 把一组百分比(0-100)渲染成进度条分段；每段代表一节课
function renderSegmented(container, values) {
    container.innerHTML = values.map(v =>
        `<span class="seg"><span class="seg-f" style="width:${Math.max(0, Math.min(100, v))}%"></span></span>`
    ).join('');
}

// ================================================================
//  日期胶囊
// ================================================================
function renderDayPills() {
    const pills = document.getElementById('dayPills');
    const todayInfo = getTodayInfo();
    let html = '';

    for (let d = 1; d <= 7; d++) {
        const offset = (state.week - 1) * 7 + (d - 1);
        const date = new Date(SEMESTER_START);
        date.setDate(SEMESTER_START.getDate() + offset);
        const dateStr = `${date.getDate()}`;

        const isToday = todayInfo && todayInfo.week === state.week && todayInfo.day === d;
        const isSelected = d === state.day;
        const hasCourse = COURSES.some(c => c.day === d && isActive(c, state.week));
        const past = isPastDate(state.week, d);

        let cls = 'day-pill';
        if (isSelected) cls += ' active';
        if (isToday) cls += ' is-today';
        if (!hasCourse) cls += ' is-empty';
        if (past) cls += ' is-past';

        html += `
            <div class="${cls}" data-day="${d}">
                <div class="pill-day">周${DAY_NAMES[d - 1]}</div>
                <div class="pill-date">${dateStr}</div>
            </div>
        `;
    }

    pills.innerHTML = html;
    pills.querySelectorAll('.day-pill').forEach(pill => {
        pill.addEventListener('click', () => {
            const d = parseInt(pill.dataset.day, 10);
            if (d === state.day) return;
            state.day = d;
            render(true);
        });
    });
}

// ================================================================
//  日视图
// ================================================================
function renderDayView(animate, expandedIds) {
    const { week, day } = state;

    const dayCourses = COURSES
        .filter(c => c.day === day && isActive(c, week))
        .sort((a, b) => a.start - b.start);

    const viewingToday = isViewingToday();
    const pastDate = isPastDate(week, day);

    const totalPeriods = dayCourses.reduce((sum, c) => sum + c.span, 0);
    document.getElementById('courseCount').textContent =
        `${dayCourses.length} 门 · ${totalPeriods} 节`;

    const main = document.getElementById('mainContent');

    if (dayCourses.length === 0) {
        main.innerHTML = `
            <div class="empty-state">
                <span class="big-icon">${ICON_LEAF}</span>
                <div class="msg">今日无课</div>
                <div class="sub-msg">第 ${week} 周 · 周${DAY_NAMES[day - 1]}</div>
            </div>
        `;
        return;
    }

    const nowMin = getNowMinutes();
    let activeId = null, upcomingId = null;
    const endedIds = new Set();

    if (pastDate) {
        dayCourses.forEach(c => endedIds.add(`${c.day}-${c.start}`));
    } else if (viewingToday) {
        let foundUpcoming = false;
        for (const c of dayCourses) {
            const s = timeToMinutes(getPeriodTime(day, c.start).start);
            const e = timeToMinutes(getPeriodTime(day, c.start + c.span - 1).end);
            const id = `${c.day}-${c.start}`;
            if (nowMin > e) endedIds.add(id);
            else if (nowMin >= s && nowMin <= e) activeId = id;
            else if (nowMin < s && !foundUpcoming) { upcomingId = id; foundUpcoming = true; }
        }
        if (activeId) upcomingId = null;
    }

    const groups = PERIOD_LABELS.map(b => ({
        ...b,
        courses: dayCourses.filter(c => b.periods.includes(c.start))
    }));

    let html = '';
    let cardIndex = 0;

    for (const group of groups) {
        if (group.courses.length === 0) continue;

        html += `
            <div class="time-block">
                <div class="time-block-header">
                    <span class="icon">${group.icon}</span>
                    <span class="label">${group.label}</span>
                    <span class="count">${group.courses.length} 门</span>
                </div>
        `;

        for (const c of group.courses) {
            const startStr = c.start;
            const endStr = c.start + c.span - 1;
            const periodDisplay = startStr === endStr ? `第${startStr}节` : `${startStr}-${endStr}节`;
            const timeRange = getTimeRange(day, c.start, c.span);
            const id = `${c.day}-${c.start}`;
            const rmIdx = COURSES.indexOf(c);

            let cardClass = 'course-card';
            let badge = '';

            if (id === activeId) {
                cardClass += ' is-active has-badge';
                badge = '<span class="status-badge">进行中</span>';
            } else if (id === upcomingId) {
                cardClass += ' is-upcoming has-badge';
                badge = '<span class="status-badge">下一节</span>';
            } else if (endedIds.has(id)) {
                cardClass += ' is-ended';
            }

            if (animate) cardClass += ' anim';
            if (expandedIds.has(id)) cardClass += ' expanded';

            const delay = animate ? Math.min(cardIndex * 55, 420) : 0;
            const accent = courseColor(c.name);

            const weeksList = parseWeeks(c.weeks);
            const weeksDisplay = weeksList.length > 8
                ? `${weeksList[0]}–${weeksList[weeksList.length - 1]} 共 ${weeksList.length} 周`
                : weeksList.join(', ') + ' 周';

            html += `
                <div class="${cardClass}" data-id="${id}"
                     style="--accent:${accent};animation-delay:${delay}ms">
                    ${badge}
                    <div class="course-time-row">
                        <span class="period-label">${periodDisplay}</span>
                        <span class="time-range">${timeRange}</span>
                    </div>
                    <div class="course-content">
                        <div class="course-name">${c.name}</div>
                        <div class="meta-row">
                            <div class="course-meta">
                                <span class="teacher">${c.teacher}</span>
                                <span class="room">${c.room}</span>
                            </div>
                            <div class="card-actions">
                                <button class="card-edit" data-rm="${rmIdx}" type="button" title="编辑课程">${ICON_EDIT}</button>
                                <button class="card-del" data-rm="${rmIdx}" type="button" title="删除课程">${ICON_X}</button>
                            </div>
                        </div>
                    </div>
                    <div class="course-detail">
                        <div class="detail-inner">
                            <div class="detail-row"><span class="detail-label">周次</span><span class="detail-value">${weeksDisplay}</span></div>
                            <div class="detail-row"><span class="detail-label">节次</span><span class="detail-value">${periodDisplay}</span></div>
                            <div class="detail-row"><span class="detail-label">时间</span><span class="detail-value">${timeRange}</span></div>
                            <div class="detail-row"><span class="detail-label">地点</span><span class="detail-value">${c.room}</span></div>
                        </div>
                    </div>
                </div>
            `;
            cardIndex++;
        }

        html += `</div>`;
    }

    main.innerHTML = html;

    main.querySelectorAll('.course-card').forEach(card => {
        const del = card.querySelector('.card-del');
        const edit = card.querySelector('.card-edit');
        if (edit) {
            edit.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const idx = parseInt(edit.dataset.rm, 10);
                if (!isNaN(idx)) openEditCourse(idx);
            });
        }
        if (del) {
            del.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!del.classList.contains('confirm')) {
                    del.classList.add('confirm');
                    del.dataset.label = del.innerHTML;
                    del.innerHTML = '确认?';
                    setTimeout(() => {
                        if (del.isConnected && del.classList.contains('confirm')) {
                            del.classList.remove('confirm');
                            del.innerHTML = del.dataset.label || ICON_X;
                        }
                    }, 2500);
                    return;
                }
                const idx = parseInt(del.dataset.rm, 10);
                if (!isNaN(idx) && COURSES[idx]) {
                    COURSES.splice(idx, 1);
                    saveCourses();
                    refreshSuggestions();
                    render(true);
                }
            });
        }
        card.addEventListener('click', (e) => {
            if (e.target.closest('.course-detail')) return;
            if (e.target.closest('.card-del')) return;
            if (e.target.closest('.card-edit')) return;
            card.classList.toggle('expanded');
        });
    });
}
