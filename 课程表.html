function renderWeekView(animate) {
    const today = getTodayInfo();
    const isCurrentWeek = today && today.week === state.week;
    const nowMin = getNowMinutes();

    let upcomingId = null;
    if (isCurrentWeek) {
        const todayCourses = COURSES
            .filter(c => c.day === today.day && isActive(c, state.week))
            .sort((a, b) => a.start - b.start);

        for (const c of todayCourses) {
            const s = timeToMinutes(getPeriodTime(today.day, c.start).start);
            if (nowMin < s) { upcomingId = `${today.day}-${c.start}`; break; }
        }
    }

    let headerHTML = '<div class="wv-corner"></div>';
    for (let d = 1; d <= 7; d++) {
        const offset = (state.week - 1) * 7 + (d - 1);
        const date = new Date(SEMESTER_START);
        date.setDate(SEMESTER_START.getDate() + offset);
        const dateStr = `${date.getMonth() + 1}/${date.getDate()}`;

        const isToday = today && today.week === state.week && today.day === d;
        const hasCourse = COURSES.some(c => c.day === d && isActive(c, state.week));
        const past = isPastDate(state.week, d);

        let cls = 'wv-head';
        if (isToday) cls += ' is-today';
        if (!hasCourse) cls += ' is-empty';
        if (past) cls += ' is-past';

        headerHTML += `
            <div class="${cls}" data-day="${d}">
                ${isToday ? '' : ''}
                <div class="wv-head-day">周${DAY_NAMES[d - 1]}</div>
                <div class="wv-head-date">${dateStr}</div>
            </div>
        `;
    }

    const axis = buildAxis; // 全周日历共用同一条普通作息轴，保证同节次同高度
    let bodyHTML = `<div class="wv-gutter">`;
    for (let p = 1; p <= 10; p++) {
        const t = NORMAL_TIMES[p];
        const sMin = timeToMinutes(t.start);
        const eMin = timeToMinutes(t.end);
        bodyHTML += `
            <div class="wv-period" style="top:${axis.top(sMin)}%;height:${axis.size(sMin, eMin)}%;">
                <span class="wv-period-num">${p}</span>
            </div>`;
    }
    bodyHTML += `</div>`;

    // 周视图：按列分批懒渲染，避免课程多时一次性构造整表阻塞主线程
    const main = document.getElementById('mainContent');
    main.innerHTML = `
        <div class="week-view">
            <div class="wv-header">${headerHTML}</div>
            <div class="wv-body">${bodyHTML}</div>
        </div>
    `;
    const bodyEl = main.querySelector('.wv-body');

    // 收集 7 天的列 HTML（每一列作为一个惰性渲染批次）
    const columns = [];
    for (let d = 1; d <= 7; d++) {
        const courses = COURSES.filter(c => c.day === d && isActive(c, state.week));
        const past = isPastDate(state.week, d);
        let colHTML = `<div class="wv-col">`;

        for (const c of courses) {
            const id = `${c.day}-${c.start}`;
            let cls = 'wv-course';
            let accent = courseColor(c.name);

            if (past) {
                cls += ' is-ended';
            } else if (isCurrentWeek && today.day === d) {
                const s = timeToMinutes(getPeriodTime(d, c.start).start);
                const e = timeToMinutes(getPeriodTime(d, c.start + c.span - 1).end);
                if (nowMin > e) cls += ' is-ended';
                else if (nowMin >= s && nowMin <= e) { cls += ' is-active'; accent = '#1E9E57'; }
                else if (id === upcomingId) { cls += ' is-upcoming'; accent = '#C2410C'; }
            }

            // 按普通节次槽位定位，保证同节次在任何一天都排在同一行
            const sCfg = NORMAL_TIMES[c.start] || NORMAL_TIMES[1];
            const eCfg = NORMAL_TIMES[Math.min(c.start + c.span - 1, 10)] || NORMAL_TIMES[10];
            const sMin = timeToMinutes(sCfg.start);
            const eMin = timeToMinutes(eCfg.end);

            colHTML += `
                <div class="${cls}"
                     style="--accent:${accent};top:${axis.top(sMin)}%;height:${axis.size(sMin, eMin)}%;"
                     data-day="${d}">
                    <div class="wv-course-name">${c.name}</div>
                </div>
            `;
        }
        colHTML += `</div>`;
        columns.push(colHTML);
    }

    // 惰性追加：每帧并入一列，让前的几列先行绘制，整体更早变为可用
    const frag = document.createDocumentFragment();
    let ci = 0;
    const step = () => {
        if (ci >= columns.length) {
            bodyEl.appendChild(frag);
            for (let d = 1; d <= 7; d++) {
                main.querySelectorAll(`.wv-course[data-day="${d}"]`).forEach(el => {
                    el.addEventListener('click', () => goDay(d));
                });
            }
            return;
        }
        const tmp = document.createElement('div');
        tmp.innerHTML = columns[ci];
        frag.appendChild(tmp.firstElementChild);
        ci++;
        requestAnimationFrame(step);
    };
    requestAnimationFrame(step);

    const goDay = (d) => {
        state.day = d;
        state.viewMode = 'day';
        render(true);
    };

    main.querySelectorAll('.wv-head').forEach(el => {
        el.addEventListener('click', () => goDay(parseInt(el.dataset.day, 10)));
    });

    const allCourses = COURSES.filter(c => isActive(c, state.week));
    const allPeriods = allCourses.reduce((s, c) => s + c.span, 0);
    document.getElementById('courseCount').textContent =
        `本周 ${allCourses.length} 门 · ${allPeriods} 节`;
}

// ================================================================
//  主渲染
// ================================================================
let lastKey = '';

function render(animate = false) {
    const main = document.getElementById('mainContent');

    const expandedIds = new Set(
        [...main.querySelectorAll('.course-card.expanded')].map(el => el.dataset.id)
    );
    const prevScroll = main.scrollTop;

    const key = `${state.week}-${state.day}-${state.viewMode}`;
    const resetScroll = key !== lastKey;
    lastKey = key;

    const { week, day } = state;

    // 周次数字 + 一体控件脉冲
    const wd = document.getElementById('currentWeekDisplay');
    if (wd.textContent !== String(week)) {
        wd.textContent = week;
        wd.classList.remove('bump');
        void wd.offsetWidth;
        wd.classList.add('bump');

        const ctrl = document.getElementById('weekCtrl');
        ctrl.classList.remove('pulse');
        void ctrl.offsetWidth;
        ctrl.classList.add('pulse');
    }

    document.getElementById('dayName').textContent = DAY_NAMES_FULL[day - 1];
    const offset = (week - 1) * 7 + (day - 1);
    const cur = new Date(SEMESTER_START);
    cur.setDate(SEMESTER_START.getDate() + offset);
    document.getElementById('dateFull').textContent =
        `${cur.getFullYear()}年${cur.getMonth() + 1}月${cur.getDate()}日`;

    renderDayPills();

    const today = getTodayInfo();
    let todayCourses = [];
    if (today) {
        todayCourses = COURSES
            .filter(c => c.day === today.day && isActive(c, today.week))
            .sort((a, b) => a.start - b.start);
    }
    updateNowPanel(todayCourses, today ? today.day : day, isViewingToday());

    renderViewToggle();

    const dayStrip = document.getElementById('dayStrip');
    dayStrip.classList.toggle('hidden', state.viewMode === 'week');

    if (state.viewMode === 'week') {
        renderWeekView(animate);
    } else {
        renderDayView(animate, expandedIds);
    }

    main.scrollTop = resetScroll ? 0 : prevScroll;

    saveState();
}

// ================================================================
//  交互
// ================================================================
function updateWeek(w) {
    w = Math.max(1, Math.min(MAX_WEEK, w));
    if (w === state.week) return;
    state.week = w;
    render(true);
}

function updateDay(delta) {
    let d = state.day + delta;
    let w = state.week;

    if (d < 1) {
        if (w > 1) { w--; d = 7; } else { d = 1; }
    } else if (d > 7) {
        if (w < MAX_WEEK) { w++; d = 1; } else { d = 7; }
    }

    if (d === state.day && w === state.week) return;

    const main = document.getElementById('mainContent');
    main.classList.add('switching');
    setTimeout(() => {
        state.day = d;
        state.week = w;
        render(true);
        main.classList.remove('switching');
    }, 110);
}

document.getElementById('prevWeek').addEventListener('click', () => updateWeek(state.week - 1));
document.getElementById('nextWeek').addEventListener('click', () => updateWeek(state.week + 1));

document.getElementById('todayBtn').addEventListener('click', () => {
    const t = getTodayInfo();
    if (t) {
        state.week = t.week;
        state.day = t.day;
        state.viewMode = 'day';
        render(true);
    } else {
        const btn = document.getElementById('todayBtn');
        btn.animate([
            { transform: 'translateX(0)' },
            { transform: 'translateX(-6px)' },
            { transform: 'translateX(6px)' },
            { transform: 'translateX(-4px)' },
            { transform: 'translateX(0)' },
        ], { duration: 340, easing: 'ease-in-out' });
        setTimeout(() => alert('当前不在学期内（第 1–18 周）'), 120);
    }
});

function findNextCourse() {
    const t = getTodayInfo();
    if (!t) return null;
    const nowMin = getNowMinutes();

    for (let offset = 0; offset < 21; offset++) {
        const totalDay = (t.day - 1) + offset;
        const day = (totalDay % 7) + 1;
        const week = t.week + Math.floor(totalDay / 7);
        if (week > MAX_WEEK) break;

        const courses = COURSES
            .filter(c => c.day === day && isActive(c, week))
            .sort((a, b) => a.start - b.start);

        for (const c of courses) {
            const s = timeToMinutes(getPeriodTime(day, c.start).start);
            const e = timeToMinutes(getPeriodTime(day, c.start + c.span - 1).end);

            if (offset === 0) {
                if (nowMin > e) continue;
                if (nowMin >= s && nowMin <= e) continue;
            }
            return { week, day, course: c };
        }
    }
    return null;
}

document.getElementById('nextCourseBtn').addEventListener('click', () => {
    const next = findNextCourse();
    if (!next) {
        alert('本学期没有更多课程');
        return;
    }

    state.viewMode = 'day';
    state.week = next.week;
    state.day = next.day;
    render(false);

    setTimeout(() => {
        const card = document.querySelector(
            `.course-card[data-id="${next.course.day}-${next.course.start}"]`
        );
        if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.classList.add('flash');
            setTimeout(() => card.classList.remove('flash'), 2000);
        }
    }, 60);
});

document.getElementById('viewToggle').addEventListener('click', () => {
    state.viewMode = state.viewMode === 'day' ? 'week' : 'day';
    render(true);
});

// 渲染视图切换按钮（显示当前视图，点击切换）
function renderViewToggle() {
    const el = document.getElementById('viewToggle');
    if (!el) return;
    const week = state.viewMode === 'week';
    el.classList.toggle('is-week', week);
    el.title = week ? '切换为日视图' : '切换为周视图';
    el.innerHTML = week
        ? `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>`
        : `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg>`;
}

// ---- 周次选择器 ----
const pickerOverlay = document.getElementById('weekPickerOverlay');
const pickerGrid = document.getElementById('weekPickerGrid');

function buildWeekPicker() {
    pickerGrid.innerHTML = '';
    for (let w = 1; w <= MAX_WEEK; w++) {
        const btn = document.createElement('button');
        btn.textContent = w;
        if (w === state.week) btn.classList.add('active');
        btn.addEventListener('click', () => {
            updateWeek(w);
            closeWeekPicker();
        });
        pickerGrid.appendChild(btn);
    }
}
function openWeekPicker() {
    buildWeekPicker();
    pickerOverlay.classList.add('active');
}
function closeWeekPicker() {
    pickerOverlay.classList.remove('active');
}

document.getElementById('weekLabelBtn').addEventListener('click', openWeekPicker);
pickerOverlay.addEventListener('click', (e) => {
    if (e.target === pickerOverlay) closeWeekPicker();
});

// ---- 添加课程 ----
document.getElementById('addCourseBtn').innerHTML = ICON_PLUS;
const addOverlay = document.getElementById('addCourseOverlay');
const acHeader = document.getElementById('acHeader');
let editingIdx = -1;
const acName = document.getElementById('acName');
const acTeacher = document.getElementById('acTeacher');
const acDay = document.getElementById('acDay');
const acStart = document.getElementById('acStart');
const acSpan = document.getElementById('acSpan');
const acRoom = document.getElementById('acRoom');
const acWeeks = document.getElementById('acWeeks');

for (let d = 1; d <= 7; d++) acDay.appendChild(new Option('周' + DAY_NAMES[d - 1], d));
for (let p = 1; p <= 10; p++) acStart.appendChild(new Option('第' + p + '节', p));

// 课程名 / 地点下拉：按当前 COURSES 实时刷新（增删后调用）
const acNameList = document.getElementById('acNameList');
const acRoomList = document.getElementById('acRoomList');
function refreshSuggestions() {
    acNameList.innerHTML = [...new Set(COURSES.map(c => c.name).filter(Boolean))]
        .sort()
        .map(n => `<option value="${n}"></option>`)
        .join('');
    acRoomList.innerHTML = [...new Set(COURSES.map(c => c.room).filter(Boolean))]
        .sort()
        .map(r => `<option value="${r}"></option>`)
        .join('');
}
refreshSuggestions();

// 「当周」：填入当前周
document.getElementById('acWeekNow').addEventListener('click', () => {
    const todayInfo = getTodayInfo();
    acWeeks.value = String(todayInfo ? todayInfo.week : state.week);
    acWeeks.focus();
});

// 输入/选到已存在的课程名时，自动补全默认教师与教室
acName.addEventListener('input', () => {
    const match = COURSES.find(c => c.name === acName.value.trim());
    if (match) {
        acTeacher.value = match.teacher || '';
        acRoom.value = match.room || '';
    }
});

function openAddCourse() {
    editingIdx = -1;
    acHeader.textContent = '添加课程';
    acName.value = '';
    acTeacher.value = '';
    acRoom.value = '';
    acWeeks.value = '2-4,6,8-18';
    acDay.value = String(state.day);
    acStart.value = '1';
    acSpan.value = '2';
    addOverlay.classList.add('active');
    acName.focus();
}
function openEditCourse(idx) {
    const c = COURSES[idx];
    if (!c) return;
    editingIdx = idx;
    acHeader.textContent = '编辑课程';
    acName.value = c.name || '';
    acTeacher.value = c.teacher || '';
    acRoom.value = c.room || '';
    acWeeks.value = c.weeks || '';
    acDay.value = String(c.day);
    acStart.value = String(c.start);
    acSpan.value = String(c.span);
    addOverlay.classList.add('active');
    acName.focus();
}
function closeAddCourse() { addOverlay.classList.remove('active'); editingIdx = -1; }

document.getElementById('addCourseBtn').addEventListener('click', openAddCourse);
document.getElementById('acCancel').addEventListener('click', closeAddCourse);
addOverlay.addEventListener('click', (e) => {
    if (e.target === addOverlay) closeAddCourse();
});
document.getElementById('acOk').addEventListener('click', () => {
    const name = acName.value.trim();
    const room = acRoom.value.trim();
    if (!name || !room) return;
    const weeks = acWeeks.value.trim() || '1-18';
    const data = {
        day: parseInt(acDay.value, 10),
        start: parseInt(acStart.value, 10),
        span: parseInt(acSpan.value, 10),
        name, teacher: acTeacher.value.trim(), room, weeks
    };
    if (editingIdx >= 0 && COURSES[editingIdx]) {
        Object.assign(COURSES[editingIdx], data);
    } else {
        COURSES.push(data);
    }
    saveCourses();
    refreshSuggestions();
    closeAddCourse();
    render(true);
});

// ---- 键盘 ----
document.addEventListener('keydown', (e) => {
    if (pickerOverlay.classList.contains('active')) {
        if (e.key === 'Escape') closeWeekPicker();
        return;
    }
    if (e.key === 'ArrowLeft')  { updateDay(-1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { updateDay(1);  e.preventDefault(); }
    if (e.key === 'ArrowUp')    { updateWeek(state.week - 1); e.preventDefault(); }
    if (e.key === 'ArrowDown')  { updateWeek(state.week + 1); e.preventDefault(); }
});

// ---- 触摸滑动 ----
let touchStartX = 0, touchStartY = 0;
// 横滑翻天后，在短时间内忽略紧随的 click，防止"滑一下 + 点一下"二次改天
let swipeGuardUntil = 0;

document.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
    if (touchStartX === 0) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;

    if (state.viewMode === 'day' && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 44) {
        swipeGuardUntil = Date.now() + 400;
        if (dx < 0) updateDay(1);
        else updateDay(-1);
    }
    touchStartX = 0;
}, { passive: true });

// 捕获阶段的护栏事件：横滑刚结束时吞掉随之而来的一次 click
document.addEventListener('click', (e) => {
    if (swipeGuardUntil && Date.now() < swipeGuardUntil) {
        e.preventDefault();
        e.stopPropagation();
        swipeGuardUntil = 0;
    }
}, true);

// ================================================================
//  光斑随现实时间变化亮度与颜色
// ================================================================
const GLOW_KEYFRAMES = [
    { time: 0,  hue: 230, sat: 60, light: 35, alpha: 0.35, bright: 0.70 }, // 深夜
    { time: 5,  hue: 260, sat: 50, light: 40, alpha: 0.40, bright: 0.80 }, // 黎明前
    { time: 7,  hue: 25,  sat: 85, light: 65, alpha: 0.75, bright: 1.10 }, // 清晨
    { time: 12, hue: 50,  sat: 90, light: 80, alpha: 0.85, bright: 1.40 }, // 正午
    { time: 17, hue: 30,  sat: 85, light: 65, alpha: 0.75, bright: 1.20 }, // 傍晚前
    { time: 19, hue: 340, sat: 70, light: 55, alpha: 0.65, bright: 1.00 }, // 日落
    { time: 22, hue: 250, sat: 55, light: 40, alpha: 0.45, bright: 0.80 }, // 夜晚
    { time: 24, hue: 230, sat: 60, light: 35, alpha: 0.35, bright: 0.70 }  // 深夜
];
// 色相走最短路径（避免绕一圈扫过绿色）
function lerpHue(h1, h2, t) {
    let diff = h2 - h1;
    if (diff >  180) diff -= 360;
    if (diff < -180) diff += 360;
    return ((h1 + diff * t) % 360 + 360) % 360;
}
const lerp = (a, b, t) => a + (b - a) * t;

function applyGlowNow() {
    const hero = document.querySelector('.hero');
    if (!hero) return;
    const now = new Date();
    const hours = now.getHours() + now.getMinutes() / 60;
    const kf = GLOW_KEYFRAMES;
    let prev = kf[0], next = kf[kf.length - 1];
    for (let i = 0; i < kf.length - 1; i++) {
        if (hours >= kf[i].time && hours <= kf[i + 1].time) { prev = kf[i]; next = kf[i + 1]; break; }
    }
    const range = next.time - prev.time;
    const t = range === 0 ? 0 : (hours - prev.time) / range;
    hero.style.setProperty('--glow-hue',   lerpHue(prev.hue, next.hue, t));
    hero.style.setProperty('--glow-sat',   lerp(prev.sat, next.sat, t) + '%');
    hero.style.setProperty('--glow-light', lerp(prev.light, next.light, t) + '%');
    hero.style.setProperty('--glow-alpha', lerp(prev.alpha, next.alpha, t));
    hero.style.setProperty('--glow-bright', lerp(prev.bright, next.bright, t));
}

// ================================================================
//  轻量时间刷新：仅在课程状态切边界时重建课程列表，避免 30s 全量重绘
// ================================================================
let lastStatusSig = '';

// 计算今日课程的当前时间状态快照（纯字符串）。只有状态真实发生变化
// （开课/下课/跨天）时快照才会改变，从而触发一次完整 render。
function computeStatusSig() {
    const t = getTodayInfo();
    const parts = [t ? `${t.week}-${t.day}` : ''];
    if (!t || t.week !== state.week) return parts.join(',');
    const nowMin = getNowMinutes();
    for (const c of COURSES) {
        if (c.day !== t.day || !isActive(c, state.week)) continue;
        const s = timeToMinutes(getPeriodTime(t.day, c.start).start);
        const e = timeToMinutes(getPeriodTime(t.day, Math.min(c.start + c.span - 1, 10)).end);
        parts.push(`${t.day}-${c.start}:${nowMin > e ? 'e' : (nowMin >= s ? 'a' : 'u')}`);
    }
    return parts.join(',');
}

function refreshTime() {
    // 轻量部分：只更新「现在」面板（含水波进度），不重建课程列表
    const t = getTodayInfo();
    const todayCourses = t
        ? COURSES.filter(c => c.day === t.day && isActive(c, t.week)).sort((a, b) => a.start - b.start)
        : [];
    updateNowPanel(todayCourses, t ? t.day : state.day, isViewingToday());

    // 仅当状态边界变化才重建列表，平时零开销
    const sig = computeStatusSig();
    if (sig !== lastStatusSig) {
        lastStatusSig = sig;
        render(false);
    }
}

// ================================================================
//  初始化
// ================================================================
render(true);
updateClock();
setInterval(updateClock, 1000);
lastStatusSig = computeStatusSig();
setInterval(refreshTime, 30000);
// 首次加载直接显示当前时间颜色，避免从橙黄过渡闪一下
const heroEl = document.querySelector('.hero');
if (heroEl) heroEl.classList.add('glow-no-transition');
applyGlowNow();
requestAnimationFrame(() => requestAnimationFrame(() => {
    if (heroEl) heroEl.classList.remove('glow-no-transition');
}));
setInterval(applyGlowNow, 60000);

// ---- 日视图日期条：点击 header 下滑出现，5 秒后自动上滑隐藏 ----
let dayStripTimer = null;
const dayStripEl = document.getElementById('dayStrip');
document.querySelector('.hero').addEventListener('click', (e) => {
    if (state.viewMode !== 'day') return;
    if (e.target.closest('button, a, select, input')) return;
    if (dayStripEl.classList.contains('hidden')) return;
    dayStripEl.classList.add('reveal');
    clearTimeout(dayStripTimer);
    dayStripTimer = setTimeout(() => dayStripEl.classList.remove('reveal'), 5000);
});
</script>
