name: Build Course Schedule APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          # 缓存调试签名密钥，保证连续构建的 APK 签名一致，可以直接覆盖安装
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kcb-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view apk-latest > /dev/null 2>&1 || \
            gh release create apk-latest \
              --title "课程表 APK（自动构建）" \
              --notes "由 GitHub Actions 从 main 分支自动构建的调试版 APK，课表内容在线加载自 GitHub Pages；电脑端同步完成后重新打开应用即可看到新课表。" \
              --latest
          gh release upload apk-latest android/app/build/outputs/apk/debug/app-debug.apk --clobber
